worker_processes 1;

pid logs/campustrace.pid;
error_log logs/campustrace-error.log warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
    }

    server {
        listen 8080;
        server_name localhost 192.168.111.148;
        root C:/phpstudy_pro/WWW/CampusTrace/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            include C:/phpstudy_pro/Extensions/Nginx1.15.11/conf/fastcgi_params;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(ini|sql|md|log|lock)$ {
            deny all;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }
    }
}

